<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Room</title><link rel='stylesheet' href='/styles.css'></head><body>
<div class='layout'>
<section><h2 id='roomLabel'></h2><p id='me'></p><p>Presenter: <strong id='presenter'>None</strong></p>
<button id='requestPresenterBtn'>Request Presenter</button><button id='startBtn'>Start Share</button><button id='stopBtn'>Stop Share</button>
<label><input type='checkbox' id='watermarkToggle'>Watermark</label>
<div class='videoWrap'><video id='remoteVideo' autoplay playsinline></video><div id='watermark' class='watermark hidden'></div></div><p id='status'></p></section>
<aside><h3>Participants</h3><ul id='participants'></ul><h3>Chat</h3><div id='chat'></div><input id='chatInput'><button id='sendChat'>Send</button><div id='approvalBox' class='hidden'><p id='approvalText'></p><button id='approveBtn'>Approve</button><button id='denyBtn'>Deny</button></div></aside>
</div>
<script src='/socket.io/socket.io.js'></script><script src='/vendor/mediasoup-client.min.js'></script><script src='/room.js'></script>
</body></html>
